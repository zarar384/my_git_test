name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-graveyard/military-draft-system-mediatr

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MilitaryDraftSystem.slnx

      - name: Build (Release)
        run: dotnet build MilitaryDraftSystem.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MilitaryDraftSystem.slnx --no-restore --no-build --configuration Release

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-graveyard/military-draft-system-mediatr/MilitaryDraftSystem.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: project-graveyard/military-draft-system-mediatr/MilitaryDraftSystem.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        # `ng test` (vitest builder) only watches in interactive TTY
        # environments and already runs once in CI by default.
        run: npm test
